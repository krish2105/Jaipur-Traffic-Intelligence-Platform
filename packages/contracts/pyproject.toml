[project]
name = "pravaah-contracts"
version = "0.1.0"
description = "Single source of truth for types, events and API schemas"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.11", "pydantic-settings>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
