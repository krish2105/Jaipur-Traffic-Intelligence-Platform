[project]
name = "pravaah-drishti"
version = "0.1.0"
description = "Network and congestion intelligence"
requires-python = ">=3.12,<3.14"
dependencies = ["pravaah-contracts", "numpy>=2.1", "pandas>=2.2", "scikit-learn>=1.6", "lightgbm>=4.6", "xgboost>=2.1", "shap>=0.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
