[project]
name = "pravaah-kavach"
version = "0.1.0"
description = "Enforcement and defaulter intelligence"
requires-python = ">=3.12,<3.14"
dependencies = ["pravaah-contracts", "lightgbm>=4.6", "shap>=0.46", "cryptography>=44.0", "pulp>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
