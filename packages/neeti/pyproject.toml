[project]
name = "pravaah-neeti"
version = "0.1.0"
description = "Bilingual agentic policy copilot"
requires-python = ">=3.12,<3.14"
dependencies = ["pravaah-contracts", "sentence-transformers>=3.4", "rank-bm25>=0.2.2", "sqlglot>=26.0", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
