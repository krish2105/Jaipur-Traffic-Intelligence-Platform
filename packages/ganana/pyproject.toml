[project]
name = "pravaah-ganana"
version = "0.1.0"
description = "Counting and classification engine"
requires-python = ">=3.12,<3.14"
dependencies = ["pravaah-contracts", "opencv-python-headless>=4.11", "numpy>=2.1", "onnxruntime>=1.22", "supervision>=0.26", "torch>=2.6", "transformers>=4.50", "pillow>=11.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
