# PRAVAAH on Render — native runtimes, no Dockerfiles.
#
# docs/DECISIONS.md ADR-012: Docker was removed from this project entirely. Our
# own services build from source with Render's native Python runtime. The one
# third-party service (Keycloak) is deployed with `runtime: image`, which pulls
# the vendor's published image directly — there is no Dockerfile in this repo
# and no Docker on any developer machine.
#
# The database is Tiger Cloud (managed TimescaleDB) and is NOT declared here: it
# is provisioned separately and injected as DATABASE_URL, so its lifecycle is
# independent of app deploys and the 750 MB free-plan ceiling (ADR-010) is
# managed on its own terms.
services:
  - type: web
    name: pravaah-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: .
    buildCommand: >-
      pip install uv &&
      uv sync --all-packages --frozen &&
      uv run alembic -c apps/api/alembic.ini upgrade head
    startCommand: >-
      uv run uvicorn pravaah.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PRAVAAH_ENV
        value: production
      - key: PRAVAAH_SOURCE_MODE
        value: live
      - key: DEMO_MODE                 # the role switcher must not exist in prod
        value: "false"
      - key: DATABASE_URL
        sync: false                    # Tiger Cloud, set in the dashboard
      - key: DATABASE_URL_READONLY
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pravaah-redis, property: connectionString }
      - key: KEYCLOAK_URL
        fromService: { type: web, name: pravaah-keycloak, property: host }
      - fromGroup: pravaah-secrets

  - type: worker
    name: pravaah-worker
    runtime: python
    plan: starter
    region: singapore
    buildCommand: pip install uv && uv sync --all-packages --frozen
    startCommand: uv run python -m pravaah.worker
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: PRAVAAH_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService: { type: keyvalue, name: pravaah-redis, property: connectionString }
      - fromGroup: pravaah-secrets

  # Third-party image, pulled by Render. Nothing to build, nothing to maintain.
  - type: web
    name: pravaah-keycloak
    runtime: image
    image: { url: quay.io/keycloak/keycloak:26.4 }
    plan: starter
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: KC_DB
        value: postgres
      - key: KC_DB_URL
        sync: false                    # Keycloak gets its own database, not ours
      - key: KC_HOSTNAME_STRICT
        value: "false"
      - key: KC_HEALTH_ENABLED
        value: "true"
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: keyvalue
    name: pravaah-redis
    plan: starter
    region: singapore
    maxmemoryPolicy: noeviction        # Streams are the event bus — never evict

  # docs/07 §3: "Automate every one of these. A retention policy that requires
  # someone to remember is a retention policy that fails."
  - type: cron
    name: pravaah-retention
    runtime: python
    schedule: "15 2 * * *"             # 02:15 IST daily
    region: singapore
    buildCommand: pip install uv && uv sync --all-packages --frozen
    startCommand: uv run python -m pravaah.worker.jobs.retention
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false
      - fromGroup: pravaah-secrets

  - type: cron
    name: pravaah-salt-rotation
    runtime: python
    schedule: "0 0 * * *"              # re-ID salt rotates every 24h (docs/07 §3)
    region: singapore
    buildCommand: pip install uv && uv sync --all-packages --frozen
    startCommand: uv run python -m pravaah.worker.jobs.rotate_salt
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.13"
      - key: DATABASE_URL
        sync: false
      - fromGroup: pravaah-secrets

envVarGroups:
  - name: pravaah-secrets
    envVars:
      - key: PLATE_KEK_BASE64
        generateValue: true
      - key: PLATE_HASH_SALT
        generateValue: true
      - key: KEYCLOAK_CLIENT_SECRET
        sync: false
      - key: TOMTOM_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
