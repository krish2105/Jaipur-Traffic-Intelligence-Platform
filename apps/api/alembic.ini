[alembic]
script_location = apps/api/migrations
prepend_sys_path = packages/contracts/src:apps/api/src
path_separator = os
# sqlalchemy.url is supplied at runtime from DATABASE_URL — never hardcode a
# connection string in a file that gets committed (docs/07 §5).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
