[project]
name = "pravaah-api"
version = "0.1.0"
description = "PRAVAAH REST + WebSocket API"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pravaah-contracts", "pravaah-adapters", "pravaah-drishti",
  "pravaah-kavach", "pravaah-neeti",
  "fastapi>=0.118", "uvicorn[standard]>=0.34",
  "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30", "psycopg[binary]>=3.2", "alembic>=1.14",
  "geoalchemy2>=0.17", "pgvector>=0.4",
  "python-jose[cryptography]>=3.4", "redis>=6.0",
  "slowapi>=0.1.9", "structlog>=25.1", "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
