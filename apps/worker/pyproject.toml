[project]
name = "pravaah-worker"
version = "0.1.0"
description = "PRAVAAH background worker — ingest, aggregation, ML, simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pravaah-contracts", "pravaah-adapters", "pravaah-ganana",
  "pravaah-drishti", "pravaah-kavach",
  "apscheduler>=3.11", "sqlalchemy[asyncio]>=2.0.36", "asyncpg>=0.30",
  "redis>=6.0", "structlog>=25.1", "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pravaah"]
